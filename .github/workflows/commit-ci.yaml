  upload_builds:
    needs:
      - build_client_desktop
      #- build_android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: install Dep
        uses: ./.github/workflows/instdep

      - name: prepare CI Venv
        run: |
          uv venv --python cpython-3.14

      - name: download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: get datetime
        id: get_datetime
        run: |
          datetime=$(uv run scripts/ci/get_datetime.py)
          echo "datetime=$datetime" >> $GITHUB_OUTPUT

      - name: get package get_version
        id: get_version
        run: |
          version=$(uv run scripts/ci/get_version.py)
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: List Dir (for debug)
        run: |
          ls .
          echo '--------'
          ls artifacts
          echo '--------'
          ls -la artifacts

      - name: prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo '----create_release----'
          gh release create "ci-pre-v${{ steps.get_version.outputs.version }}-${{ github.sha }}" \
            --title "pre-release: ${{ steps.get_version.outputs.version }}+${{ steps.get_datetime.outputs.datetime }} (${{ github.sha }})" \
            --notes "**這是使用Github Action製作的測試版**
            - 版本： ${{ steps.get_version.outputs.version }}
            - 時間： ${{ steps.get_datetime.outputs.datetime }}
            - github_sha： ${{ github.sha }}" \
            --prerelease \
            --repo="${{ github.repository }}"
          echo '----Get Upload Url----'
          upload_url_base=$(gh api \
            repos/${{ github.repository }}/releases/tags/ci-pre-v${{ steps.get_version.outputs.version }}-${{ github.sha }} \
            --jq '.upload_url')
          echo 'upload_url_base=$upload_url_base'
          echo '----upload----'
          set -euo pipefail
          upload_url="${upload_url_base%\{*}"
          echo "Uploading artifacts to $upload_url"
          shopt -s globstar || true
          for f in artifacts/**; do
            if [ -f "$f" ]; then
              echo "Uploading $f"
              curl -X POST \
                -H "Authorization: token $GITHUB_TOKEN" \
                -H "Content-Type: application/octet-stream" \
                --data-binary @"$f" \
                "$upload_url?name=$(basename "$f")"
            fi
          done
