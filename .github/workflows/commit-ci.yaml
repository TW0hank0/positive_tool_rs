name: commit-ci

on:
  push:
    branches:
      - master

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Dep
        uses: ./.github/workflows/instdep

      - name: Run debug check
        run: cargo check --workspace

      - name: Run release check
        run: cargo check --release --workspace

      - name: Run License Check
        run: |
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          uv run scripts/license_check.py

      - name: Lint toml file
        run: taplo lint

      - name: Run cargo-msrv script
        run: uv run scripts/cargo_msrv.py

      - name: Run cargo-audit
        run: cargo audit

      - name: Run cargo-deny
        run: |
          cargo deny fetch
          cargo deny check

  build_client_desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Dep
        uses: ./.github/workflows/instdep

      - name: use build script
        run: uv run scripts/build_client_desktop.py

      - name: zip files on Linux
        id: zip_files_linux
        if: runner.os == 'Linux'
        run: |
          file=$(uv run scripts/zip_client_desktop.py)
          echo "zip_path=$file" >> $GITHUB_OUTPUT

      - name: zip files on Windows
        id: zip_files_windows
        if: runner.os == 'Windows'
        run: |
          $file = (uv run scripts/zip_client_desktop.py)
          echo "zip_path=$file" >> $env:GITHUB_OUTPUT

      - name: Upload exe artifact on Linux
        uses: actions/upload-artifact@v6
        if: runner.os == 'Linux'
        with:
          name: ${{ steps.zip_files_linux.outputs.zip_path }}
          path: ${{ steps.zip_files_linux.outputs.zip_path }}

      - name: Upload exe artifact on Windows
        uses: actions/upload-artifact@v6
        if: runner.os == 'Windows'
        with:
          name: ${{ steps.zip_files_windows.outputs.zip_path }}
          path: ${{ steps.zip_files_windows.outputs.zip_path }}

